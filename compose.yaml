services:
  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://hexagonal:hexagonal@db:5432/hexagonal
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://hexagonal:hexagonal@db:5432/hexagonal
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: hexagonal
      POSTGRES_PASSWORD: hexagonal
      POSTGRES_DB: hexagonal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
