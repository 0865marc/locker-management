name: locker-management-demo

services:
  frontend:
    build:
      context: ./frontend
      args:
        PUBLIC_API_BASE_URL: ${PUBLIC_API_BASE_URL-http://127.0.0.1:8000}
    ports:
      - "127.0.0.1:4321:80"

  api:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS-http://localhost:4321,http://127.0.0.1:4321}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-locker_management_demo}:${POSTGRES_PASSWORD:-locker_management_demo}@db:5432/${POSTGRES_DB:-locker_management_demo}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-locker_management_demo}:${RABBITMQ_DEFAULT_PASS:-locker_management_demo}@rabbitmq/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "worker.py"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-locker_management_demo}:${POSTGRES_PASSWORD:-locker_management_demo}@db:5432/${POSTGRES_DB:-locker_management_demo}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-locker_management_demo}:${RABBITMQ_DEFAULT_PASS:-locker_management_demo}@rabbitmq/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-locker_management_demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-locker_management_demo}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-locker_management_demo}:${POSTGRES_PASSWORD:-locker_management_demo}@db:5432/${POSTGRES_DB:-locker_management_demo}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-locker_management_demo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-locker_management_demo}
      POSTGRES_DB: ${POSTGRES_DB:-locker_management_demo}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 2s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  rabbitmq_data:
