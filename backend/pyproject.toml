[project]
name = "hexagonal-fastapi"
version = "0.1.0"
description = "Delivery y Return: arquitectura hexagonal con FastAPI y PostgreSQL"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    # Motor interno de SQLModel; el extra instala soporte para asyncio.
    "sqlalchemy[asyncio]>=2.0,<2.1",
    "sqlmodel>=0.0.22,<0.1",
    "alembic>=1.13,<2",
    "asyncpg>=0.30,<1",
    "aio-pika>=9.5,<10",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pyright>=1.1.414,<2"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "worker"]

[tool.setuptools.packages.find]
include = ["domain*", "application*", "adapters*"]
